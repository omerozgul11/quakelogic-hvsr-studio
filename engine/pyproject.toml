[project]
name = "quakelogic-hvsr-engine"
version = "1.0.0"
description = "QuakeLogic HVSR Studio - scientific engine (hvsr_engine) and local processing service (hvsr_service)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "obspy>=1.4.2,<2",
    "pandas>=2.2,<3",
    "matplotlib>=3.10,<4",
    "reportlab>=4.2,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
]
validation = [
    "hvsrpy>=2.0",
    "ipython>=8.0",
]

[project.scripts]
hvsr-service = "hvsr_service.__main__:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hvsr_engine*", "hvsr_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
