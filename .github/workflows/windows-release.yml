name: Windows release

# Builds the standalone Windows distribution (portable zip + setup.exe installer) on a GitHub
# Windows runner. Runs on every version tag (v1.0.0, v1.1.0, …) and on demand. On a tag the
# files are attached to a GitHub Release, ready to send to clients.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, zip, gd, intl, fileinfo, curl, openssl
          tools: composer:v2
          coverage: none

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build the distribution (bundled PHP + Python + wheels)
        run: python packaging/build_dist.py --skip-frontend --out dist

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path engine/pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DStageDir=$PWD\dist\QuakeLogic-HVSR-Studio" "/DOutDir=$PWD\dist" "packaging\windows\installer.iss"
          Get-ChildItem dist -File | Select-Object Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuakeLogic-HVSR-Studio-windows
          path: |
            dist/*.zip
            dist/*-setup-win-x64.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: QuakeLogic HVSR Studio ${{ github.ref_name }}
          body: |
            Standalone Windows x64 build of QuakeLogic HVSR Studio.

            * **QuakeLogic-HVSR-Studio-…-setup-win-x64.exe** — installer (recommended): download, double-click, the application opens in its own window. No account, no internet connection, nothing else to install.
            * **QuakeLogic-HVSR-Studio-…-win-x64.zip** — portable build: unzip anywhere and double-click `HVSR Studio.vbs`.
          files: |
            dist/*.zip
            dist/*-setup-win-x64.exe
