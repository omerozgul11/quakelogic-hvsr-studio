name: Windows release

# Builds the standalone Windows distribution (portable zip + setup.exe installer) on a GitHub
# Windows runner. Runs on every version tag (v1.0.0, v1.1.0, …) and on demand. On a tag the
# files are attached to a GitHub Release, ready to send to clients.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, zip, gd, intl, fileinfo, curl, openssl
          tools: composer:v2
          coverage: none

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build the distribution (bundled PHP + Python + wheels)
        id: dist
        shell: pwsh
        run: |
          # A short output path keeps the bundled site-packages below the Windows MAX_PATH limit.
          python packaging/build_dist.py --skip-frontend --out C:\hvsr-dist 2>&1 | Tee-Object -FilePath build-dist.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path engine/pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DStageDir=C:\hvsr-dist\QuakeLogic-HVSR-Studio" "/DOutDir=C:\hvsr-dist" "packaging\windows\installer.iss"
          Get-ChildItem C:\hvsr-dist -File | Select-Object Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuakeLogic-HVSR-Studio-windows
          path: |
            C:\hvsr-dist\*.zip
            C:\hvsr-dist\*-setup-win-x64.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: QuakeLogic HVSR Studio ${{ github.ref_name }}
          body: |
            Standalone Windows x64 build of QuakeLogic HVSR Studio.

            * **QuakeLogic-HVSR-Studio-…-setup-win-x64.exe** — installer (recommended): download, double-click, the application opens in its own window. No account, no internet connection, nothing else to install.
            * **QuakeLogic-HVSR-Studio-…-win-x64.zip** — portable build: unzip anywhere and double-click `HVSR Studio.vbs`.
          files: |
            C:\hvsr-dist\*.zip
            C:\hvsr-dist\*-setup-win-x64.exe

      - name: Report a failed build as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build-dist.log', 'utf8'); } catch (e) { log = '(no build-dist.log — the failure happened in another step)'; }
            const tail = log.split(/\r?\n/).slice(-150).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Windows release build failed (${context.ref_name || context.ref})`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nLast lines of build-dist.log:\n\n\`\`\`\n${tail}\n\`\`\``,
            });
