; QuakeLogic HVSR Studio — PHP settings applied to every PHP process started by the launcher
; (via PHP_INI_SCAN_DIR, so they also reach the `php -S` worker that `artisan serve` spawns).
upload_max_filesize = 4096M
post_max_size = 4096M
max_file_uploads = 200
memory_limit = 1024M
max_execution_time = 600
max_input_time = 600
date.timezone = UTC
display_errors = Off
log_errors = On
